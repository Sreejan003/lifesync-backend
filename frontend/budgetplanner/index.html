<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Planner - Integrated into LifeSync Dashboard</title>
  <meta http-equiv="refresh" content="1;url=../index.html#budget" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f6fd;
      color: #1e1b4b;
      padding: 20px;
    }
    .redirect-card {
      background: #ffffff;
      border: 1px solid rgba(112, 72, 232, 0.15);
      border-radius: 24px;
      padding: 40px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(112, 72, 232, 0.08);
    }
    .icon-badge {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #7048e8, #9a52f4);
      color: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px;
      box-shadow: 0 8px 20px rgba(112, 72, 232, 0.25);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #0f172a;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-return {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #7048e8, #9a52f4);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      border-radius: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-return:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(112, 72, 232, 0.3);
    }
    .spinner {
      margin: 18px auto 0;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(112, 72, 232, 0.2);
      border-top-color: #7048e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="icon-badge">₹</div>
    <h1>Budget Planner is now Integrated!</h1>
    <p>
      Budget Planner is no longer a standalone app. All features—Runway model, Peer Benchmarks, Late-Night Safe, Roommate Splits, and Savings Goals—are built directly into your unified LifeSync dashboard.
    </p>
    <a href="../index.html#budget" class="btn-return">
      <span>Open Integrated Dashboard</span>
      <span>→</span>
    </a>
    <div class="spinner"></div>
  </div>
  <script>
    setTimeout(function() {
      window.location.replace('../index.html#budget');
    }, 800);
  </script>
</body>
</html>
